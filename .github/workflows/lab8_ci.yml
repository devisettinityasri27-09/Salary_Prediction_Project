
name: Salary Prediction - Lab 8 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn joblib mlflow

      - name: Run Data Validation
        run: python src/mlops_pipeline/02_validate_data.py

      - name: Run Quality Gate
        run: python src/mlops_pipeline/07_quality_gate.py

      - name: Upload Quality Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report
          path: artifacts/quality_gate_report.json
